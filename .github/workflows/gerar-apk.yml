name: Gerar APK Android TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências e gerar build Web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configurar Capacitor para Android TV
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "Luiz Jiu-Jitsu Timer" "br.com.luizjiujitsu.timer" --web-dir=dist
          npx cap add android

      - name: Configurar Tela Cheia, Paisagem e Launcher Android TV
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="landscape"/g' $MANIFEST
          sed -i 's/<category android:name="android.intent.category.LAUNCHER" \/>/<category android:name="android.intent.category.LAUNCHER" \/><category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>/g' $MANIFEST

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Luiz-JiuJitsu-Timer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
